<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Esfinge</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <!-- El lockup, como el de la barra lateral de la ventana (ADR 0021 y 0029), y
         debajo el sitio de la pestaña con su icono. A la derecha, si la bóveda está
         abierta. -->
    <header>
      <span class="marca" aria-hidden="true"></span>
      <div class="cabecera">
        <strong>Esfinge</strong>
        <span class="sitio">
          <img id="favicon" alt="" hidden />
          <span id="inicial-sitio" class="monograma chico" aria-hidden="true" hidden></span>
          <span id="donde"></span>
        </span>
      </div>
      <span id="abierta" class="abierta" hidden><span class="punto"></span>Abierta</span>
    </header>

    <main>
      <!-- Mientras se pregunta: dos filas vacías con la forma de las de verdad,
           para que el panel no dé un salto cuando lleguen. -->
      <div id="cargando" class="cargando" role="status">
        <span class="solo-lectores">Preguntando a Esfinge…</span>
        <div class="hueco"></div>
        <div class="hueco"></div>
      </div>

      <ul id="lista" aria-label="Cuentas de este sitio" hidden></ul>

      <!-- Lo que no es una lista: la bóveda cerrada, sin permiso, sin Esfinge…
           Con la esfinge grande y tenue detrás, como el historial vacío de la
           ventana: aquí no se trabaja, así que es sitio para la marca. -->
      <section id="estado" class="estado" hidden>
        <span class="tenue" aria-hidden="true"></span>
        <span class="glifo" aria-hidden="true"></span>
        <div>
          <h1></h1>
          <p class="texto"></p>
          <p class="detalle" hidden></p>
        </div>
      </section>
    </main>

    <!-- El resultado del último gesto: «Rellenado», «Contraseña copiada»… -->
    <p id="resultado" class="resultado" role="status" hidden></p>

    <!-- La versión, a la vista —cuando algo falla, lo primero es saber qué versión
         se está mirando—, y la firma de la casa, como al pie de la barra lateral. -->
    <footer>
      <span id="pie"></span>
      <span class="firma"><span class="barra" aria-hidden="true">▍</span>webcafeína</span>
    </footer>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
