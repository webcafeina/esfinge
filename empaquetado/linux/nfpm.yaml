# Paquete .deb de Esfinge.
#
# Lleva la aplicación con ventana, la línea de comandos, el lanzador para el menú
# de aplicaciones y la declaración de qué es un fichero .esf.
name: esfinge
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Webcafeína <info@webcafeina.com>
description: |
  Cifra y descifra contraseñas y ficheros con una clave.
  Con ventana propia y con línea de comandos, sobre el mismo núcleo.
  Nada sale de la máquina.
vendor: Webcafeína
homepage: https://github.com/webcafeina/esfinge
license: Propietaria

contents:
  - src: build/bin/Esfinge
    dst: /usr/bin/esfinge-gui
  - src: esfinge
    dst: /usr/bin/esfinge
  - src: empaquetado/linux/esfinge.desktop
    dst: /usr/share/applications/esfinge.desktop
  - src: empaquetado/linux/esfinge-mime.xml
    dst: /usr/share/mime/packages/esfinge.xml
  # Todos los tamaños del tema, no solo el grande: con uno solo cada entorno se
  # lo reescala como puede, y en el menú de aplicaciones se nota.
  - src: build/linux/hicolor/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/esfinge.png
  - src: build/linux/hicolor/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/esfinge.png
  - src: build/linux/hicolor/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/esfinge.png
  - src: build/linux/hicolor/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/esfinge.png
  - src: build/linux/hicolor/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/esfinge.png
  - src: build/linux/hicolor/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/esfinge.png
  - src: build/linux/hicolor/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/esfinge.png
  - src: build/linux/hicolor/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/esfinge.png
  # El icono del tipo de fichero, que no es el de la aplicación: si fuera el
  # mismo, un .esf y Esfinge se verían igual en el explorador de ficheros. Va en
  # «mimetypes/» y con el nombre del tipo —la barra cambiada por un guion—, que
  # es donde y como lo busca el escritorio.
  - src: build/linux/mimetypes/16x16.png
    dst: /usr/share/icons/hicolor/16x16/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/24x24.png
    dst: /usr/share/icons/hicolor/24x24/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/32x32.png
    dst: /usr/share/icons/hicolor/32x32/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/48x48.png
    dst: /usr/share/icons/hicolor/48x48/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/64x64.png
    dst: /usr/share/icons/hicolor/64x64/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/128x128.png
    dst: /usr/share/icons/hicolor/128x128/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/256x256.png
    dst: /usr/share/icons/hicolor/256x256/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/512x512.png
    dst: /usr/share/icons/hicolor/512x512/mimetypes/application-x-esfinge.png
  - src: LICENSE
    dst: /usr/share/doc/esfinge/copyright

# El webview lo pone el sistema, no el paquete: son las mismas bibliotecas que
# usa cualquier navegador del escritorio.
depends:
  - libwebkit2gtk-4.1-0
  - libgtk-3-0

scripts:
  postinstall: empaquetado/linux/postinstall.sh
