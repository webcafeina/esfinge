# Paquete .deb de Esfinge.
#
# Lleva la aplicación con ventana, la línea de comandos, el lanzador para el menú
# de aplicaciones y la declaración de qué es un fichero .esf.
name: esfinge
# **La arquitectura es una variable, como la versión.** Estaba a fuego en `amd64`, y eso
# es lo que hacía que un `.deb` instalado en una máquina ARM lo rechazara `dpkg`: el
# paquete declaraba una arquitectura que no era la de la máquina. nfpm expande el entorno
# igual que con ${VERSION}, así que el mecanismo ya estaba probado.
arch: ${ARQUITECTURA}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Webcafeína <info@webcafeina.com>
# **El inglés delante y el español detrás, y la primera línea en ASCII puro.**
#
# Es la misma regla que el listado de Chocolatey y que la ficha de AppStream, y aquí tiene
# además una razón mecánica: **la ventana que abre un doble clic sobre el `.deb` convierte
# este texto a ASCII y pone «?» donde hay acentos**. Lo vio el cliente el 2026-11-25
# leyendo «contrase?as» en la primera línea de un gestor de contraseñas.
#
# Lo nuestro es correcto —la política pide los ficheros de control en UTF-8 (5.1) y eso es
# lo que llevamos, y le pasa igual a 23 de los 966 paquetes de este servidor, `gh` entre
# ellos—, así que esto no arregla el fallo: lo que hace es que **lo primero que se lee no
# dependa de quien lo enseña**. Elegido por el cliente entre tres opciones con las tres
# pantallas delante.
#
# La primera línea es el resumen y en muchos sitios es lo único que se ve (política 3.4.1):
# menos de 80 caracteres y sin repetir el nombre del paquete. Es **la misma frase** que el
# `<summary>` por omisión de la ficha de AppStream, y hay una prueba que las compara.
#
# El ` .` separa los dos párrafos, que es como se hace en un fichero de control. En el `.rpm`
# —que comparte esta descripción— sale como una línea con un punto suelto: es la única pega y
# se acepta, porque el `.deb` es el que instala un cliente a mano.
description: |
  Encrypt passwords and files with one key (app in Spanish)
  Esfinge encrypts and decrypts passwords and files with a single key, and keeps a
  local password vault. Its interface and documentation are in Spanish only.
  .
  Cifra y descifra contraseñas y ficheros con una clave. Con ventana propia y con
  línea de comandos, sobre el mismo núcleo. Nada sale de la máquina.
vendor: Webcafeína
homepage: https://github.com/webcafeina/esfinge
license: Propietaria

contents:
  - src: build/bin/Esfinge
    dst: /usr/bin/esfinge-gui
  - src: esfinge
    dst: /usr/bin/esfinge
  # El proceso que lanza el navegador para hablar con la bóveda. Va aparte del
  # binario de la línea de comandos a propósito: ver cmd/esfinge-puente.
  - src: esfinge-puente
    dst: /usr/bin/esfinge-puente
  # Y el que lanza un agente de IA (ADR 0054). Aparte por lo mismo que el puente, y
  # en el PATH porque la configuración que Ajustes enseña lleva su ruta entera.
  - src: esfinge-mcp
    dst: /usr/bin/esfinge-mcp
  - src: empaquetado/linux/esfinge.desktop
    dst: /usr/share/applications/esfinge.desktop
  - src: empaquetado/linux/esfinge-mime.xml
    dst: /usr/share/mime/packages/esfinge.xml
  # Los metadatos que lee un centro de software. Sin ellos, Esfinge sale en el
  # App Center, en GNOME Software y en Discover como una entrada pelada, y ya
  # instalada no aparece como aplicación instalada: el `.desktop` lo lee el menú
  # de aplicaciones, no la tienda. Los porqués están dentro del fichero.
  - src: empaquetado/linux/esfinge.metainfo.xml
    dst: /usr/share/metainfo/com.webcafeina.esfinge.metainfo.xml
  # Todos los tamaños del tema, no solo el grande: con uno solo cada entorno se
  # lo reescala como puede, y en el menú de aplicaciones se nota.
  - src: build/linux/hicolor/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/esfinge.png
  - src: build/linux/hicolor/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/esfinge.png
  - src: build/linux/hicolor/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/esfinge.png
  - src: build/linux/hicolor/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/esfinge.png
  - src: build/linux/hicolor/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/esfinge.png
  - src: build/linux/hicolor/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/esfinge.png
  - src: build/linux/hicolor/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/esfinge.png
  - src: build/linux/hicolor/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/esfinge.png
  # El icono del tipo de fichero, que no es el de la aplicación: si fuera el
  # mismo, un .esf y Esfinge se verían igual en el explorador de ficheros. Va en
  # «mimetypes/» y con el nombre del tipo —la barra cambiada por un guion—, que
  # es donde y como lo busca el escritorio.
  - src: build/linux/mimetypes/16x16.png
    dst: /usr/share/icons/hicolor/16x16/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/24x24.png
    dst: /usr/share/icons/hicolor/24x24/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/32x32.png
    dst: /usr/share/icons/hicolor/32x32/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/48x48.png
    dst: /usr/share/icons/hicolor/48x48/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/64x64.png
    dst: /usr/share/icons/hicolor/64x64/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/128x128.png
    dst: /usr/share/icons/hicolor/128x128/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/256x256.png
    dst: /usr/share/icons/hicolor/256x256/mimetypes/application-x-esfinge.png
  - src: build/linux/mimetypes/512x512.png
    dst: /usr/share/icons/hicolor/512x512/mimetypes/application-x-esfinge.png
  - src: LICENSE
    dst: /usr/share/doc/esfinge/copyright

# El webview lo pone el sistema, no el paquete: son las mismas bibliotecas que
# usa cualquier navegador del escritorio.
depends:
  - libwebkit2gtk-4.1-0
  - libgtk-3-0

scripts:
  postinstall: empaquetado/linux/postinstall.sh

# **Lo que cambia por empaquetador, y es poco pero no se puede adivinar.**
#
# Las mismas bibliotecas se llaman distinto en cada distribución: en Debian y Ubuntu son
# `libwebkit2gtk-4.1-0` y `libgtk-3-0`, y en Fedora **`webkit2gtk4.1` y `gtk3`** —sin el
# guion antes del 4.1, al contrario que en Arch, que usa `webkit2gtk-4.1`—. No están
# adivinados: salen de la ficha 0030 de Apolo, que los midió instalando de verdad en un
# contenedor de Fedora, y aquí los vuelve a comprobar `humo.yml`.
#
# Y cada uno lleva **su propio guion de postinstalación**, porque lo único que cambia es
# qué gestor deja escrito en /usr/share/esfinge/gestor y ese fichero se ejecuta en el
# equipo de quien instala: una variable de aquí no llegaría allí. Que los dos no se
# separen lo vigila una prueba que los compara línea a línea.
overrides:
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3
    scripts:
      postinstall: empaquetado/linux/postinstall-rpm.sh

# **Y el .rpm va firmado**, con la misma clave que firma los repositorios APT y RPM de
# esfinge.webcafeina.com (`web.yml`).
#
# No es un adorno: el `esfinge.repo` que se publica lleva `gpgcheck=1`, así que **dnf rechaza un
# paquete sin firmar** — y el error que sale entonces habla de claves y no dice nada de nosotros. El
# `.deb` no se firma, y eso es lo normal: en Debian lo que se firma es el índice del repositorio
# (`InRelease`) y no cada paquete.
#
# Va aquí y no en `overrides`, que es donde lo puse primero: `signature` no es un campo que se pueda
# sobreescribir por empaquetador, y nfpm lo dice claro —«field signature not found in type
# nfpm.Overridables»—. Cada empaquetador tiene su propia sección.
#
# La clave sale de un fichero que escribe el flujo desde el secreto y la frase va por el entorno
# (`NFPM_RPM_PASSPHRASE`): **nunca como argumento**, que es la regla de la casa. Y con la variable
# vacía nfpm no firma, que es lo que permite armar un .rpm de prueba en un portátil.
rpm:
  signature:
    key_file: ${CLAVE_DE_PAQUETES}
