# Plantilla: `herramientas/rellenar` pone la versión, los nombres y las sumas de los dos
# instaladores. Lo de antes de la primera línea en blanco no llega al manifiesto.

PackageIdentifier: Webcafeina.Esfinge
PackageVersion: "{{VERSION}}"
InstallerType: nullsoft
Scope: machine
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  # Lo que hace que Esfinge sepa que vino de winget (ADR 0063): el instalador lo deja escrito
  # a su lado y, con eso, la banda dice «la instala tu gestor de paquetes» en vez de ofrecer
  # una actualización que dejaría a winget viendo una versión vieja. Es lo mismo que pasa
  # Chocolatey en su `chocolateyinstall.ps1`.
  Custom: /GESTOR=winget
ReleaseNotesUrl: https://github.com/webcafeina/esfinge/releases/tag/v{{VERSION}}
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/webcafeina/esfinge/releases/download/v{{VERSION}}/{{NOMBRE:app-windows-amd64}}
    InstallerSha256: {{SHA:app-windows-amd64}}
  - Architecture: arm64
    InstallerUrl: https://github.com/webcafeina/esfinge/releases/download/v{{VERSION}}/{{NOMBRE:app-windows-arm64}}
    InstallerSha256: {{SHA:app-windows-arm64}}
ManifestType: installer
ManifestVersion: 1.6.0
