<!--
  Fondo de la imagen de disco de macOS.

  Es lo primero que se ve de Esfinge, antes incluso de instalarla, así que el
  trabajo aquí es sencillo: decir qué es, decir qué hacer, y quitarse de en
  medio. Los tres iconos —la aplicación, la carpeta Aplicaciones y el LÉEME— los
  coloca create-dmg encima de este fondo, en las posiciones que reservan los
  huecos, y esas posiciones tienen que cuadrar con las de empaquetado/macos/armar-dmg.sh.

  **La cuenta que hay que respetar.** El Finder centra el icono en la posición
  que se le da y escribe su nombre debajo: con iconos de 96 px y texto de 12, el
  pie del nombre queda unos 64 px por debajo del centro. Todo lo que se dibuje
  ahí lo pisa el icono. Fue lo que pasó con el LÉEME en la 2.0.2, que se comió
  el aviso de Gatekeeper.

  Se dibuja a 660×470, que es el tamaño de la ventana, y se rasteriza al doble
  para las pantallas Retina.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#232329"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#d99a28"/>
    </linearGradient>
  </defs>

  <rect width="660" height="470" fill="url(#fondo)"/>

  <!-- Marca, discreta, arriba a la izquierda: el hueco de abajo ahora lo ocupa
       el LÉEME. -->
  <g transform="translate(24 46)">
    <rect width="3" height="12" rx="1.5" y="-9" fill="url(#oro)"/>
    <text x="10" y="0"
          font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
          font-size="11" fill="#7a766f">webcafeína</text>
  </g>

  <!-- Nombre y qué hace. Arriba, fuera del camino de los iconos. -->
  <text x="330" y="98" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="27" font-weight="600" fill="#f0ece2" letter-spacing="-0.3">Esfinge</text>
  <text x="330" y="124" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="13" fill="#a8a49c">Cifra y descifra secretos con una clave</text>

  <!-- La instrucción, entre los dos iconos: arrastra de aquí a allá. Los iconos
       van centrados en x=165 y x=495, a la altura y=215. -->
  <text x="330" y="196" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="12" font-weight="500" fill="#c9c5bd">Arrastra</text>

  <g stroke="#6a6a74" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M258 222 H392" stroke-dasharray="7 7"/>
    <path d="M384 214 l10 8 -10 8"/>
  </g>

  <!-- Pies de cada icono, por debajo del nombre que escribe el Finder. -->
  <text x="165" y="308" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="11" fill="#8e8a84">La aplicación</text>
  <text x="495" y="308" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="11" fill="#8e8a84">Tus aplicaciones</text>

  <!-- Debajo de la línea, lo que hay que saber antes de la primera vez. El icono
       del LÉEME va a la izquierda, centrado en (108, 392), y el aviso a su
       derecha: así el icono y el motivo para abrirlo se leen juntos. -->
  <path d="M40 345 H620" stroke="#45454e" stroke-width="1" fill="none"/>

  <text x="190" y="386"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="12" font-weight="500" fill="#c9c5bd">La primera vez, macOS dirá que no está firmada.</text>
  <text x="190" y="406"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="11.5" fill="#8e8a84">No es un fallo. En el LÉEME está cómo abrirla igualmente.</text>
</svg>
