<!--
  Icono del volumen: lo que se ve en el escritorio y en la barra lateral del
  Finder cuando la imagen de disco está montada.

  **Por qué no vale el icono de la aplicación a secas.** Antes se usaba ése, y
  entonces el volumen montado y la aplicación que hay dentro se veían exactamente
  igual: en la barra lateral del Finder no había forma de distinguir «el disco»
  de «lo que hay en el disco». Un disco con el icono encima dice las dos cosas.

  **El disco va vertical.** El primer intento lo puso apaisado y no se reconocía:
  los discos del sistema son rectángulos de pie, más altos que anchos, como una
  unidad externa apoyada. Corregido mirando un Mac de verdad.

  **Y el icono va tal cual**, con sus colores, no repintado en otro tono. Lleva su
  propio fondo oscuro, así que se sostiene solo contra la cara clara del disco;
  redibujarlo en dorado sobre gris —que fue el segundo intento— lo dejaba
  desvaído y ya no parecía la misma marca.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- El cuerpo del disco: metal claro, con la luz cayendo desde arriba. -->
    <linearGradient id="metal" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/>
      <stop offset="0.5" stop-color="#e6e7ec"/>
      <stop offset="1" stop-color="#c4c6ce"/>
    </linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b6bf"/>
      <stop offset="1" stop-color="#93959e"/>
    </linearGradient>

    <!-- Lo de dentro es el icono de la aplicación, el mismo de build/icono.svg.
         Va copiado y no enlazado porque el rasterizador carga un SVG suelto y no
         resolvería una referencia a otro fichero. -->
    <linearGradient id="piedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#2b2b31"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#d99a28"/>
    </linearGradient>

    <path id="tocado"
          d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236h246l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218z"/>
    <clipPath id="soloTocado"><use href="#tocado"/></clipPath>
  </defs>

  <!-- El disco, de pie. La proporción es lo que lo hace reconocible a 32
       píxeles: más alto que ancho. -->
  <g>
    <!-- Canto, que es lo que le da grosor. -->
    <rect x="268" y="140" width="488" height="776" rx="76" fill="url(#canto)"/>
    <!-- Cara. -->
    <rect x="268" y="120" width="488" height="776" rx="76" fill="url(#metal)"/>
    <!-- Filo de luz arriba. -->
    <path d="M344 130h336a76 76 0 0 1 65 38H279a76 76 0 0 1 65-38z" fill="#ffffff" opacity="0.9"/>
    <!-- Contorno, para que el disco no se disuelva sobre un escritorio claro. -->
    <rect x="268" y="120" width="488" height="776" rx="76"
          fill="none" stroke="#8b8d97" stroke-width="7" opacity="0.6"/>

    <!-- El icono de la aplicación, tal cual, centrado en la cara. -->
    <g transform="translate(512 508) scale(0.39) translate(-512 -512)">
      <rect width="1024" height="1024" rx="228" fill="url(#piedra)"/>

      <use href="#tocado" fill="url(#oro)"/>

      <g clip-path="url(#soloTocado)" fill="#2b2b31" opacity="0.5">
        <rect x="180" y="452" width="680" height="30"/>
        <rect x="180" y="524" width="680" height="30"/>
      </g>

      <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"
            fill="#e8dcc4"/>

      <g fill="#2b2b31">
        <rect x="408" y="386" width="80" height="32" rx="16"/>
        <rect x="536" y="386" width="80" height="32" rx="16"/>
      </g>

      <g fill="#e8dcc4">
        <circle cx="512" cy="808" r="54"/>
        <path d="M484 840h56l14 106H470z"/>
      </g>
    </g>
  </g>
</svg>
