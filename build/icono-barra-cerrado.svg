<!--
  El icono de la barra con la bóveda cerrada: la silueta apagada y un candado.

  **El candado va dibujado en el icono y no en la insignia**, porque la insignia
  de los navegadores solo admite texto, y un candado en texto es un emoji que
  cada sistema dibuja a su manera.

  **Y dibujado como una insignia más**: una placa de piedra con el candado en
  blanco, grande, abajo a la derecha, donde el navegador pone el número y el ✓.
  En la 2.20.0 era un círculo pequeño y el cliente lo vio demasiado pequeño al
  lado de las otras dos. Blanco sobre piedra es la misma pareja que el número,
  medida en `internal/tema/extension_test.go`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="87 123 850 850">
  <defs>
    <path id="tocado"
          d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236h246l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218z"/>
    <clipPath id="soloTocado"><use href="#tocado"/></clipPath>
  </defs>

  <!-- El tocado primero, con su contorno; luego las bandas recortadas contra él;
       y el rostro y el ojal encima, con el suyo. **En ese orden**, como en
       `icono.svg`: con las bandas al final, pintaban por encima de la cara. -->
  <use href="#tocado" fill="#a1a1a8" stroke="#2b2b31" stroke-width="90" stroke-linejoin="round"
       paint-order="stroke"/>

  <g clip-path="url(#soloTocado)" fill="#2b2b31" opacity="0.5">
    <rect x="180" y="452" width="680" height="30"/>
    <rect x="180" y="524" width="680" height="30"/>
  </g>

  <g stroke="#2b2b31" stroke-width="90" stroke-linejoin="round" paint-order="stroke">
    <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"
          fill="#d8d8de"/>
    <circle cx="512" cy="808" r="54" fill="#d8d8de"/>
    <path d="M484 840h56l14 106H470z" fill="#d8d8de"/>
  </g>

  <g fill="#2b2b31">
    <rect x="408" y="386" width="80" height="32" rx="16"/>
    <rect x="536" y="386" width="80" height="32" rx="16"/>
  </g>

  <!-- La placa del candado, del tamaño de una insignia. -->
  <rect x="487" y="523" width="450" height="450" rx="96" fill="#2b2b31"/>
  <rect x="598" y="740" width="228" height="170" rx="30" fill="#ffffff"/>
  <path d="M642 742v-52a70 70 0 0 1 140 0v52" fill="none" stroke="#ffffff" stroke-width="46"
        stroke-linecap="round"/>
</svg>
