<!--
  La marca monocroma: la esfinge dibujada a trazo, para usarla dentro de la
  ventana.

  **No es el icono, y no debe serlo.** `icono.svg` es una composición a color
  sobre una placa de piedra con esquinas de 228 px: eso va en el Dock y en la
  barra de tareas. Metido dentro de la propia ventana, un icono de aplicación en
  miniatura se lee como un pegote pegado ahí, no como una marca. Y al llevar sus
  colores dentro no se puede teñir, así que no serviría ni para el lockup de la
  barra lateral —que va del color de la tinta— ni para el vacío del historial
  —que va del color del filete—.

  **Por qué a trazo y no rellena.** Se probaron las dos, y una silueta maciza es
  un borrón: en monocromo el rostro y el tocado son del mismo color, se pegan y
  desaparece lo que hace reconocible a la esfinge. A trazo se leen los dos, y de
  paso **rima con los iconos de la barra lateral**, que ya son de trazo
  monocromo (ADR 0019). El grosor de 58 salió de mirarla a 18, 20, 24, 48 y 96
  px: a 46 se adelgaza en pequeño y a 72 se emborrona.

  Se descartó recortar el rostro con `evenodd`, que era lo primero que uno
  intenta: el rostro sobresale del tocado por abajo, así que la mitad queda
  hueca y la otra maciza. Sale una herradura.

  Dos reglas que este fichero tiene que cumplir, y por eso está escrito así:

  1. **`currentColor` en todo**, para que cada sitio lo pinte con su token.
  2. **Sin `id`, `clipPath` ni `mask`.** Se inserta en línea y hasta tres veces
     en la misma página; con identificadores, el segundo y el tercero chocarían
     con el primero. Ésa es también la razón de que el grosor sea un atributo:
     se puede afinar desde CSS sin tocar este fichero.

  Los trazados salen tal cual de `icono.svg`, sin retocar, para que las dos
  piezas no puedan separarse con el tiempo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="currentColor"
     role="img" aria-hidden="true" focusable="false">
  <!-- Tocado y rostro, a trazo. -->
  <g fill="none" stroke="currentColor" stroke-width="58" stroke-linejoin="round">
    <path d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236h246l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218z"/>
    <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"/>
  </g>

  <!-- Los ojos, macizos: dentro del rostro hueco son lo único que se lee en
       pequeño, y son los que impiden que la cabeza parezca una capucha. -->
  <path d="M424 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>
  <path d="M552 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>

  <!-- El ojal de la llave: lo que hace la herramienta, sin escribirlo. -->
  <path d="M512 754a54 54 0 1 0 0 108 54 54 0 1 0 0-108z"/>
  <path d="M484 840h56l14 106H470z"/>
</svg>
