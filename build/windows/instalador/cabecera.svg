<!--
  La cabecera de las páginas interiores del instalador (150 × 57).

  Fondo blanco porque la banda de la cabecera lo es: con otro color se vería el
  recuadro de la imagen dentro de la banda. Sin texto, por lo mismo que la otra.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <rect width="150" height="57" fill="#ffffff"/>
  <g fill="currentColor" transform="translate(96 8) scale(0.0442) translate(-60 -101)" style="color: #2b2b31">
    <!-- Tocado y rostro, a trazo. El tocado, en dos trazos abiertos: ver arriba. -->
  <g fill="none" stroke="currentColor" stroke-width="58" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236M635 478l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218"/>
    <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"/>
  </g>

  <!-- Los ojos, macizos: dentro del rostro hueco son lo único que se lee en
       pequeño, y son los que impiden que la cabeza parezca una capucha. -->
  <path d="M424 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>
  <path d="M552 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>

  <!-- El ojal de la llave: lo que hace la herramienta, sin escribirlo. -->
  <g transform="translate(0 40)">
    <path d="M512 754a54 54 0 1 0 0 108 54 54 0 1 0 0-108z"/>
    <path d="M484 840h56l14 106H470z"/>
  </g>
  </g>
  <rect x="86" y="8" width="3" height="41" fill="#f2c14e"/>
</svg>
