<!--
  La imagen de la izquierda del instalador de Windows (164 × 314).

  **Sin una sola letra dentro, y es a propósito.** NSIS estira esta imagen hasta
  llenar su control —«FitControl», que es el modo de serie— y el control cambia
  de tamaño con el DPI de la pantalla, así que a 200 % esto se dibuja al doble
  sin que la documentación diga con qué calidad. Los textos del instalador los
  pinta Windows y ésos sí salen nítidos (ManifestDPIAware); lo que no puede
  llevar texto es esto. Por lo mismo va con formas grandes y planas: lo que se
  estira mal es el detalle fino.

  La esfinge va centrada y grande, ocupando casi todo el ancho. Aquí hubo una
  primera versión con la marca arriba y un filete suelto abajo, y mirándola se
  veía lo que era: un adorno huérfano en un panel medio vacío.

   no sobra: los ojos y el ojal son macizos y no dicen con
  qué se rellenan, así que sin eso salen negros. Lo pone el `<svg>` de
  `marca.svg`, y aquí se usa su cuerpo sin esa envoltura.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <rect width="164" height="314" fill="#2b2b31"/>
  <g fill="currentColor" transform="translate(12 85) scale(0.1547) translate(-60 -101)" style="color: #f2c14e">
    <!-- Tocado y rostro, a trazo. El tocado, en dos trazos abiertos: ver arriba. -->
  <g fill="none" stroke="currentColor" stroke-width="58" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236M635 478l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218"/>
    <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"/>
  </g>

  <!-- Los ojos, macizos: dentro del rostro hueco son lo único que se lee en
       pequeño, y son los que impiden que la cabeza parezca una capucha. -->
  <path d="M424 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>
  <path d="M552 386h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32z"/>

  <!-- El ojal de la llave: lo que hace la herramienta, sin escribirlo. -->
  <g transform="translate(0 40)">
    <path d="M512 754a54 54 0 1 0 0 108 54 54 0 1 0 0-108z"/>
    <path d="M484 840h56l14 106H470z"/>
  </g>
  </g>
</svg>
