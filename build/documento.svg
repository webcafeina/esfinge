<!--
  Icono del documento: lo que el Finder enseña en un fichero .esf.

  **Por qué no vale el icono de la aplicación.** Hasta ahora `build/esf.png` era
  una copia byte a byte de `build/appicon.png`, así que un documento cifrado y el
  programa que lo abre se veían exactamente igual. Es el mismo error que ya se
  corrigió en el icono del volumen del DMG: con el mismo dibujo no hay forma de
  distinguir «la cosa» de «lo que abre la cosa».

  **La forma es la del sistema, no una nuestra.** Un documento de macOS es una
  hoja vertical con la esquina de arriba a la derecha doblada, y eso es lo que lo
  hace legible como documento a cualquier tamaño. Debajo del doblez se ve el
  dorso del papel, un poco más oscuro que la cara.

  **Y la marca va sobre una placa oscura, con el logo tal cual.** Ésa fue la
  decisión al dibujar el disco del DMG: una versión en negativo del logo para
  fondo claro no quedaba bien, y lo que funciona es el logo de siempre sobre su
  propio fondo. Aquí sirve igual, y de paso resuelve el problema de contraste: el
  rostro es color crema y sobre papel blanco desaparecería.

  Como el resto de iconos de la casa: formas grandes y pocos detalles, porque
  esto se ve a 32 píxeles la mayor parte del tiempo. Sin texto a propósito —una
  extensión escrita ahí es una mancha ilegible en pequeño—; lo que tiene que
  aguantar es la silueta: hoja, doblez y placa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- El papel. Apenas un degradado: lo justo para que no parezca un recorte
         plano, sin llegar a leerse como color. -->
    <linearGradient id="papel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>

    <!-- El dorso de la esquina doblada: más oscuro que la cara, que es lo que
         hace que se lea como un doblez y no como un triángulo pegado. -->
    <linearGradient id="dorso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ccd4"/>
      <stop offset="1" stop-color="#e6e8ee"/>
    </linearGradient>

    <linearGradient id="piedraDoc" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#54545d"/>
      <stop offset="1" stop-color="#2b2b31"/>
    </linearGradient>
    <linearGradient id="oroDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#d99a28"/>
    </linearGradient>

    <path id="tocadoDoc"
          d="M512 150c-140 0-236 94-236 218v74l-62 228c-6 22 10 44 33 44h104l38-236h246l38 236h104c23 0 39-22 33-44l-62-228v-74c0-124-96-218-236-218z"/>
    <clipPath id="soloTocadoDoc"><use href="#tocadoDoc"/></clipPath>
  </defs>

  <!-- La hoja, con la esquina de arriba a la derecha cortada. El corte y el
       doblez tienen que medir lo mismo o el papel no cuadra. -->
  <path d="M206 40 H684 L844 200 V958 a26 26 0 0 1 -26 26 H206 a26 26 0 0 1 -26 -26
           V66 a26 26 0 0 1 26 -26 Z"
        fill="url(#papel)"/>

  <!-- El doblez. Va después de la hoja para quedar encima del corte. -->
  <path d="M684 40 L844 200 H684 Z" fill="url(#dorso)"/>

  <!-- Contorno, para que la hoja no se disuelva sobre el fondo blanco de una
       ventana del Finder. Repite el mismo camino que la hoja. -->
  <path d="M206 40 H684 L844 200 V958 a26 26 0 0 1 -26 26 H206 a26 26 0 0 1 -26 -26
           V66 a26 26 0 0 1 26 -26 Z"
        fill="none" stroke="#b9bcc6" stroke-width="7" opacity="0.75"/>

  <!-- La placa con la marca, en la mitad de abajo, que es donde macOS pone el
       emblema de los documentos.
       **Mide algo más de la mitad del ancho de la hoja, no dos tercios.** Con la
       placa grande el papel casi no se veía y el icono volvía a parecer el de la
       aplicación, que es exactamente lo que se venía a arreglar: lo que dice
       «documento» es el papel, no el emblema. -->
  <rect x="322" y="446" width="380" height="380" rx="82" fill="url(#piedraDoc)"/>

  <!-- El logo de siempre, centrado en la placa. El desplazamiento vertical
       (-548) es el centro real del dibujo, que no es 512: el ojal de la llave
       lo baja. -->
  <g transform="translate(512 636) scale(0.345) translate(-512 -548)">
    <use href="#tocadoDoc" fill="url(#oroDoc)"/>

    <g clip-path="url(#soloTocadoDoc)" fill="#2b2b31" opacity="0.5">
      <rect x="180" y="452" width="680" height="30"/>
      <rect x="180" y="524" width="680" height="30"/>
    </g>

    <path d="M512 232c-86 0-156 62-156 142v90c0 62 38 116 92 138v76c0 35 29 64 64 64s64-29 64-64v-76c54-22 92-76 92-138v-90c0-80-70-142-156-142z"
          fill="#e8dcc4"/>

    <g fill="#2b2b31">
      <rect x="408" y="386" width="80" height="32" rx="16"/>
      <rect x="536" y="386" width="80" height="32" rx="16"/>
    </g>

    <g fill="#e8dcc4">
      <circle cx="512" cy="808" r="54"/>
      <path d="M484 840h56l14 106H470z"/>
    </g>
  </g>
</svg>
