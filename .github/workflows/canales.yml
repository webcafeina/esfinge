# Los canales de distribución: el AUR, el tap de Homebrew y Chocolatey.
#
# Los repositorios APT y RPM **no están aquí**: van con la web (`web.yml`), porque se sirven desde
# el mismo GitHub Pages y se rehacen en cada despliegue.
#
# # Cómo se dispara, y por qué no de la forma obvia
#
# Lo llama `publicar.yml` con `needs:`, cuando la versión ha salido entera. **No con
# `on: release: published`**, que es lo que hace Apolo y lo que parece natural: ese evento **no se
# dispara cuando la publicación la crea `GITHUB_TOKEN`** —regla de GitHub, sin excepciones—. Apolo
# puede porque su publicación sale como borrador y la publica una persona; la de Esfinge sale ya
# publicada. Copiarlo tal cual daría tres flujos que **no se ejecutan nunca, en silencio**, con el
# tap sirviendo una versión de hace meses y nadie enterándose.
#
# # Y lo que este flujo comprueba al final
#
# Que los canales **sirven de verdad la versión que se acaba de publicar**, y si no, falla. Apolo
# aquí sale con `exit 0` cuando el tap ya estaba en esa versión, y eso tapa el caso que importa:
# «se quedó atrás y nadie se enteró». Un canal que miente es peor que un canal que no existe.
#
# **Chocolatey queda fuera de esa comprobación**, y no por descuido: su tienda **modera cada
# versión** —la 1.0.0 de Apolo la aprobó un moderador días después—, así que lo único que depende de
# nosotros es que la subida se acepte. Eso sí se comprueba; que esté publicada, no se puede.
name: Canales

on:
  workflow_call:
    inputs:
      version:
        description: La versión que se acaba de publicar, sin la «v»
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: La versión que ya está publicada, sin la «v»
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canales-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recetas:
    name: Rellenar las recetas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }

      # Las sumas salen del SHA256SUMS **de la publicación**, no de los ficheros locales: lo que
      # las recetas prometen es lo que está colgado ahí, y es lo que quien instala va a bajar.
      - name: Las sumas de la publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${{ inputs.version }}" -p SHA256SUMS -D "$RUNNER_TEMP"

      - name: Rellenar
        run: |
          set -euo pipefail
          mkdir -p recetas/Formula recetas/Casks recetas/aur recetas/choco/tools
          v="${{ inputs.version }}"
          s="$RUNNER_TEMP/SHA256SUMS"
          go run ./herramientas/rellenar "$v" empaquetado/homebrew/esfinge.rb      "$s" > recetas/Formula/esfinge.rb
          go run ./herramientas/rellenar "$v" empaquetado/homebrew/esfinge-cask.rb "$s" > recetas/Casks/esfinge.rb
          go run ./herramientas/rellenar "$v" empaquetado/aur/PKGBUILD            "$s" > recetas/aur/PKGBUILD
          go run ./herramientas/rellenar "$v" empaquetado/chocolatey/esfinge.nuspec "$s" > recetas/choco/esfinge.nuspec
          go run ./herramientas/rellenar "$v" empaquetado/chocolatey/tools/chocolateyinstall.ps1 "$s" > recetas/choco/tools/chocolateyinstall.ps1
          cp empaquetado/chocolatey/tools/chocolateyuninstall.ps1 recetas/choco/tools/
          # **winget quiere los tres manifiestos en una carpeta** (ADR 0063): la versión, el
          # idioma por defecto y los instaladores. Los nombres de fichero no son libres: los
          # exige el repositorio de Microsoft, con el identificador del paquete delante.
          mkdir -p recetas/winget
          for m in Webcafeina.Esfinge.yaml Webcafeina.Esfinge.locale.es-ES.yaml Webcafeina.Esfinge.installer.yaml; do
            go run ./herramientas/rellenar "$v" "empaquetado/winget/$m" "$s" > "recetas/winget/$m"
          done
          # **Lo de antes de la primera línea en blanco no llega al canal**: son notas para quien
          # mantiene la plantilla, y en un PKGBUILD del AUR o en una ficha de Chocolatey saldrían
          # publicadas. Es lo que hace Apolo, y por eso cada plantilla empieza con su comentario y
          # una línea vacía.
          for f in recetas/aur/PKGBUILD recetas/choco/esfinge.nuspec recetas/choco/tools/*.ps1; do
            awk 'quitando && NF==0 { quitando=0; next } !quitando { print }' quitando=1 "$f" > "$f.limpio"
            mv "$f.limpio" "$f"
          done
          head -4 recetas/aur/PKGBUILD
      - uses: actions/upload-artifact@v4
        with: { name: recetas, path: recetas }

  homebrew:
    name: El tap de Homebrew
    needs: recetas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: recetas, path: recetas }
      - name: Empujar la fórmula y el cask
        env:
          CLAVE: ${{ secrets.HOMEBREW_TAP_CLAVE }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:webcafeina/homebrew-esfinge.git tap
          mkdir -p tap/Formula tap/Casks
          cp recetas/Formula/esfinge.rb tap/Formula/esfinge.rb
          cp recetas/Casks/esfinge.rb tap/Casks/esfinge.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/esfinge.rb Casks/esfinge.rb
          # **«Sin cambios» no es un fallo si lo que hay es la versión que se quería.**
          #
          # La primera versión de esto fallaba siempre que el diff saliera vacío, con el argumento
          # de que la versión viaja en las recetas y dos publicaciones no pueden dar el mismo
          # fichero. Cierto — y **relanzar la misma versión sí**, que es una operación normal y
          # para la que existe el disparador manual. Se cayó relanzando la 2.66.3 sobre un tap que
          # ya la tenía.
          #
          # Lo que de verdad hay que separar son dos cosas que se ven iguales en el diff: que el
          # tap **ya esté** en esa versión —y entonces no hay nada que hacer— y que no se haya
          # rellenado nada, que es el fallo que esto vino a cazar. Lo distingue mirar **qué dice el
          # fichero**, no si ha cambiado. Es más estricto que el `exit 0` de Apolo, que da por
          # bueno cualquier diff vacío y tapa el caso de «se quedó atrás y nadie se enteró».
          if git diff --cached --quiet; then
            if grep -q 'version "${{ inputs.version }}"' Formula/esfinge.rb && \
               grep -q 'version "${{ inputs.version }}"' Casks/esfinge.rb; then
              echo "· el tap ya estaba en la ${{ inputs.version }}: nada que empujar"
              exit 0
            fi
            echo "::error::Las recetas no han cambiado y el tap tampoco está en la ${{ inputs.version }}: algo no se ha rellenado"
            exit 1
          fi
          git commit -q -m "Esfinge ${{ inputs.version }}"
          git push -q
          echo "✓ el tap, en la ${{ inputs.version }}"

  aur:
    name: El AUR
    needs: recetas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: recetas, path: recetas }
      - name: Empujar el PKGBUILD
        env:
          CLAVE: ${{ secrets.AUR_CLAVE }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          # **El registro de usuarios del AUR está cerrado** (2026-11-16, y ya lo estaba cuando se
          # publicó Apolo), así que todavía no hay cuenta y esta clave no está registrada en
          # ninguna. Mientras sea así, esto **avisa y sale bien**: una publicación de Esfinge no
          # puede quedarse en rojo por algo que no está en nuestra mano, y Arch no se queda sin
          # nada — la web sirve el PKGBUILD relleno en /aur, que se instala con `makepkg -si`, y
          # eso es lo que el último trabajo comprueba.
          #
          # **Solo se perdona ese error y ninguno más.** «Permission denied (publickey)» es «esta
          # clave no está en ninguna cuenta»; cualquier otra cosa —el AUR caído, el repositorio
          # rechazando el empujón, el .SRCINFO mal— es un fallo de verdad y para. El día que abran
          # el registro, esto empieza a funcionar sin tocar una línea: lo único que cambia es que
          # el `ssh` deja de contestar eso.
          if ! ssh -o BatchMode=yes -o ConnectTimeout=20 aur@aur.archlinux.org help 2>&1 | tee /tmp/aur.txt; then
            if grep -q "Permission denied (publickey)" /tmp/aur.txt; then
              echo "::notice::El AUR no admite cuentas nuevas todavía, así que esta clave no está registrada: Arch se sirve del PKGBUILD de https://esfinge.webcafeina.com/aur/PKGBUILD (makepkg -si)"
              exit 0
            fi
            echo "::error::El AUR no contesta lo que debería; esto no es «no hay cuenta»"
            exit 1
          fi
          git clone ssh://aur@aur.archlinux.org/esfinge-bin.git aur || {
            # La primera vez el repositorio no existe: se crea empujando.
            mkdir aur && git -C aur init -q -b master
            git -C aur remote add origin ssh://aur@aur.archlinux.org/esfinge-bin.git
          }
          cp recetas/aur/PKGBUILD aur/PKGBUILD
          cd aur
          # **El .SRCINFO es obligatorio y lo genera `makepkg`**, no se escribe a mano: el AUR
          # rechaza un empujón sin él, y si no cuadra con el PKGBUILD la web del AUR enseña una
          # versión y `makepkg` instala otra.
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c '
            useradd -m c && chown -R c /pkg && su c -c "makepkg --printsrcinfo > .SRCINFO"'
          git config user.name "Webcafeína"
          git config user.email "info@webcafeina.com"
          git add PKGBUILD .SRCINFO
          # Lo mismo que en el tap: relanzar la misma versión no es un fallo, y lo que lo
          # distingue es qué dice el fichero.
          if git diff --cached --quiet; then
            if grep -q "^pkgver=${{ inputs.version }}$" PKGBUILD; then
              echo "· el AUR ya estaba en la ${{ inputs.version }}: nada que empujar"
              exit 0
            fi
            echo "::error::El PKGBUILD no ha cambiado y tampoco está en la ${{ inputs.version }}: algo no se ha rellenado"
            exit 1
          fi
          git commit -q -m "esfinge-bin ${{ inputs.version }}"
          git push -q origin HEAD:master
          echo "✓ el AUR, en la ${{ inputs.version }}"

  chocolatey:
    name: Chocolatey
    needs: recetas
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: recetas, path: recetas }
      - name: Armar y subir el paquete
        shell: pwsh
        env:
          CLAVE: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION_QUE_SUBE: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CLAVE) {
            Write-Host "::error::Falta CHOCOLATEY_API_KEY"
            exit 1
          }
          Set-Location recetas/choco
          choco pack
          $nupkg = (Get-ChildItem *.nupkg | Select-Object -First 1).Name
          Write-Host "· $nupkg"
          # **La clave va por la entrada del propio `choco`, no en la línea de órdenes**: un
          # argumento queda en el registro del flujo y en el historial de la máquina.
          choco apikey --source https://push.chocolatey.org/ --key "$env:CLAVE" --limit-output | Out-Null
          # Dos salidas buenas: aceptada, o «ya existe esa versión» —que pasa si se relanza el
          # flujo— y no es un fallo. Cualquier otra cosa sí.
          $salida = choco push $nupkg --source https://push.chocolatey.org/ 2>&1 | Out-String
          Write-Host $salida
          if ($LASTEXITCODE -ne 0) {
            if ($salida -match 'already exists|version .* has already') {
              Write-Host "· esa versión ya estaba subida; nada que hacer"
            } else {
              # **Una subida rechazada no tumba la publicación de Esfinge**, y esto no es
              # relajar la guardia: es que **Chocolatey no acepta otra versión mientras tiene
              # una en revisión**. Visto el 2026-11-16: la 2.66.1 entró, su página quedó en
              # «Pending automated review», y la 2.66.3 recibió un 403 cuarenta minutos después.
              # Mientras eso dure, fallar aquí dejaría en rojo **todas** las publicaciones por
              # algo que no está en nuestra mano — y la moderación de ese paquete puede tardar
              # días.
              #
              # Lo que sí es nuestro está arriba y sigue parando: que falte la clave.
              #
              # Y el .nupkg queda colgado de este trabajo, así que subirlo a mano cuando se
              # apruebe la anterior es bajarlo y un `choco push`.
              Write-Host "::warning::Chocolatey no ha aceptado la $env:VERSION_QUE_SUBE (lo de arriba es su respuesta). Lo normal es que sea porque tiene otra versión en revisión: https://community.chocolatey.org/packages/esfinge"
              Write-Host "· el paquete queda como artefacto de este trabajo para subirlo a mano"
              exit 0
            }
          }
          Write-Host "✓ subida; la aprobación es de su moderación y puede tardar días"

      - uses: actions/upload-artifact@v4
        with:
          name: chocolatey-nupkg
          path: recetas/choco/*.nupkg

  winget:
    name: winget
    needs: recetas
    runs-on: windows-latest
    steps:
      # El repositorio, porque de él sale `herramientas/reintentar.sh`.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: recetas, path: recetas }

      # **El envío es un PR al repositorio de Microsoft**, no una subida a un servidor nuestro:
      # `microsoft/winget-pkgs` es un repositorio de manifiestos, así que publicar ahí es abrir
      # un PR desde un fork de la cuenta de Webcafeína y esperar a su validación.
      #
      # Lo hace `wingetcreate`, **del origen y con su suma**, como NSIS: `aka.ms/wingetcreate/latest`
      # es una etiqueta rodante y eso ya costó dos publicaciones aquí con otra herramienta.
      - name: Mandar los manifiestos
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION_QUE_SUBE: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TOKEN) {
            # **Sin testigo no se falla**, por lo mismo que Chocolatey: esto depende de que una
            # persona haya firmado la CLA de Microsoft y creado su fork, y hasta entonces no
            # tiene sentido dejar en rojo todas las publicaciones. Los manifiestos quedan
            # colgados de este trabajo y se pueden mandar a mano.
            Write-Host "::warning::Falta WINGET_TOKEN: los manifiestos quedan como artefacto y no se manda nada. Hace falta la CLA de Microsoft firmada y un fork de microsoft/winget-pkgs en la cuenta."
            exit 0
          }

          $version = "1.28.1.0"
          $suma = "63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413"
          $url = "https://github.com/microsoft/winget-create/releases/download/v$version/wingetcreate.exe"
          bash herramientas/reintentar.sh curl -fsSL -o wingetcreate.exe "$url"
          $vista = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLower()
          if ($vista -ne $suma) {
            Write-Host "::error::La suma de wingetcreate no es la que debería: esperaba $suma y he visto $vista"
            exit 1
          }

          # `submit` valida los manifiestos y abre el PR. Si falla, **esto sí para**: a
          # diferencia de Chocolatey, aquí no hay una cola ajena que lo explique.
          .\wingetcreate.exe submit --token $env:TOKEN recetas\winget
          Write-Host "✓ manifiestos mandados; el PR lo revisa Microsoft"

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifiestos
          path: recetas/winget/*.yaml

  # **Y lo que de verdad cierra la fase: preguntarle a cada canal qué sirve.**
  #
  # No «¿hemos empujado?», que es lo que dicen los trabajos de arriba, sino «¿qué contesta el canal
  # a quien lo use?». Son dos preguntas distintas y solo la segunda es la que le importa a quien
  # instala.
  comprobar:
    name: Los canales sirven la versión
    needs: [homebrew, aur, chocolatey]
    runs-on: ubuntu-latest
    steps:
      - name: Preguntarles
        run: |
          set -uo pipefail
          v="${{ inputs.version }}"
          mal=0
          # Lo que se le pega a la URL para saltarse cualquier caché intermedia.
          sep_anticache="sincache=$(date +%s)"
          #
          # **Y una cosa que hay que saber si esto falla el primer día**: las dos últimas preguntas
          # van a esfinge.webcafeina.com, que necesita su CNAME puesto y el dominio activado en
          # Pages. Mientras no lo esté, estas dos fallan **a propósito**: las recetas que se acaban
          # de empujar nombran ese dominio, así que si no resuelve, lo que se ha publicado no vale.
          # **Con anticaché y con reintentos.** Lo de delante de /apt es Cloudflare y lo de detrás
          # acaba de desplegarse: preguntar sin más puede traer el índice de la versión anterior y
          # decir que el canal miente cuando lo que miente es la caché. Y al revés también importa:
          # si Cloudflare llegara a cachear esos ficheros de verdad, quien tenga el repositorio
          # puesto vería un índice viejo — está apuntado en deuda.md, junto a lo de la web.
          mira() {
            local que="$1" url="$2" patron="$3"
            local cuerpo sep="?"
            case "$url" in *\?*) sep="&" ;; esac
            cuerpo="$(curl -fsSL --retry 5 --retry-delay 10 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' "$url$sep_anticache" 2>/dev/null || true)"
            [ -n "$cuerpo" ] || cuerpo="$(curl -fsSL --retry 3 --retry-delay 10 "$url" 2>/dev/null || true)"
            if [ -z "$cuerpo" ]; then
              echo "  ✕ $que: no contesta ($url)"; mal=1; return
            fi
            if printf '%s' "$cuerpo" | grep -q "$patron"; then
              echo "  ✓ $que sirve la $v"
            else
              echo "  ✕ $que NO sirve la $v"; mal=1
            fi
          }
          mira "el tap (fórmula)" "https://raw.githubusercontent.com/webcafeina/homebrew-esfinge/main/Formula/esfinge.rb" "$v"
          mira "el tap (cask)"    "https://raw.githubusercontent.com/webcafeina/homebrew-esfinge/main/Casks/esfinge.rb" "$v"
          # **Arch, por donde hoy se instala de verdad.** El paquete del AUR todavía no existe
          # —su registro de usuarios está cerrado—, así que el canal de Arch es el PKGBUILD que
          # sirve la web, y eso **sí** se exige: es lo que alguien va a usar con `makepkg -si`.
          mira "el PKGBUILD de la web" "https://esfinge.webcafeina.com/aur/PKGBUILD" "pkgver=$v"
          # Y el del AUR solo cuando exista, para que el día que abran el registro esto empiece a
          # mirarlo sin que nadie se acuerde de venir a quitar un «si».
          if curl -fsI --retry 2 "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=esfinge-bin" >/dev/null 2>&1; then
            mira "el AUR" "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=esfinge-bin" "pkgver=$v"
          else
            echo "  · el AUR todavía no tiene el paquete (su registro está cerrado): no se le pregunta"
          fi
          mira "el repositorio APT" "https://esfinge.webcafeina.com/apt/dists/stable/main/binary-amd64/Packages" "Version: $v"
          mira "el repositorio RPM" "https://esfinge.webcafeina.com/rpm/repodata/repomd.xml" "primary"
          [ $mal -eq 0 ] || { echo "::error::Hay canales que no sirven la $v"; exit 1; }
