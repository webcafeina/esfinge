# Compila Esfinge en los tres sistemas.
#
# Una aplicación con ventana necesita el webview de cada sistema operativo, y
# eso no cruza de plataforma: la de macOS solo se puede construir en un Mac. Por
# eso está esto. La línea de comandos, que no usa cgo, sí cruza y se compila
# entera en Linux.
#
# **Se dispara solo a mano.** No en cada empujón —los minutos de macOS se cuentan
# diez veces más caros y compilar una aplicación de escritorio en cada commit es
# tirarlos— y tampoco al publicar una etiqueta, que es lo que hacía hasta la
# 2.16.0 y era trabajo duplicado: «Publicar» compila los tres sistemas y desde la
# 2.16.0 **corre estas mismas comprobaciones como puerta**.
#
# Que corriera en las etiquetas tuvo además un efecto peor que gastar minutos:
# este flujo llevaba seis versiones en rojo —por unos vectores del formato que el
# .gitignore se tragaba— y lo único que producía era un correo de fallo al lado
# de una publicación en verde. Un aviso que no para nada acaba leyéndose como
# ruido. Ahora lo que falla, para.
#
# **Y se puede pedir con inspector**, que es la red para los fallos que solo se
# dan en un sistema que no se puede ejecutar en la máquina de desarrollo. Ver la
# entrada «inspector» de abajo.

name: Compilar

on:
  workflow_dispatch:
    inputs:
      inspector:
        description: "Con inspector, para diagnosticar. NO es una compilación para publicar."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  comprobar:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar la interfaz
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Vet y tests de Go
        run: |
          go vet ./...
          go vet -tags dev ./...
          go test ./...

      # Mide el contraste de las parejas de color que la interfaz usa de verdad,
      # en los dos temas, y falla si una no llega a AA.
      - name: Contraste
        run: go test ./internal/tema/ -run TestContrasteDeLosDosTemas -v

      # Los tokens los genera Go: si el CSS del repositorio se ha quedado atrás,
      # la interfaz estaría pintando los colores de ayer.
      - name: Los tokens están al día
        run: go test ./internal/tema/ -run TestLosTokensEstanAlDia

      - name: Tipos de la interfaz
        working-directory: frontend
        run: pnpm exec tsc -b --noEmit

      # Mueve la interfaz de verdad contra el Go de verdad, en claro y en oscuro.
      - name: Pruebas de la interfaz
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-pruebas
          path: frontend/playwright-report/
          retention-days: 7

  aplicacion:
    name: Aplicación · ${{ matrix.nombre }}
    needs: comprobar
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: macOS
            os: macos-latest
            # Universal cubre Apple Silicon e Intel en un solo paquete.
            plataforma: darwin/universal
            artefacto: Esfinge-macOS
          - nombre: Windows
            os: windows-latest
            plataforma: windows/amd64
            artefacto: Esfinge-Windows
          - nombre: Linux
            os: ubuntu-latest
            plataforma: linux/amd64
            artefacto: Esfinge-Linux
            # Ubuntu reciente ya no trae webkit2gtk-4.0, que es lo que Wails
            # busca de serie. La 4.1 se pide con su etiqueta.
            etiquetas: webkit2_41

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # El webview de Linux no viene en el runner.
      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # **Fuera los repositorios de terceros antes de mirar.**
          #
          # La máquina de GitHub trae listas que esta compilación no necesita para
          # nada —la de Chrome, entre otras— y `apt-get update` **falla entero** si
          # cualquiera de ellas sirve un índice caducado. Eso dejó sin publicar la
          # 2.14.0: un problema en un servidor de Google, en una compilación que
          # solo necesita GTK y WebKit de los archivos de Ubuntu.
          # Se buscan **por contenido y no por nombre**: el nombre del fichero
          # cambia entre imágenes de la máquina —`.list`, `.sources`, o dentro del
          # `sources.list` de siempre— y quitar el que uno supone deja el problema
          # igual, que es lo que pasó al primer intento.
          grep -rIl 'dl\.google\.com\|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d;/packages\.microsoft\.com/d' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar wails
        run: bash herramientas/reintentar.sh go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Construir la interfaz
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # go:embed no puede salir del directorio de su paquete, así que la interfaz
      # construida se copia a donde la aplicación la embebe.
      - name: Colocar la interfaz
        shell: bash
        run: |
          rm -rf internal/interfaz/dist
          mkdir -p internal/interfaz/dist
          cp -r frontend/dist/. internal/interfaz/dist/

      # El inspector se pide con «-devtools», que añade la etiqueta del mismo
      # nombre. En macOS eso hace que Wails avise de que el paquete usa APIs
      # privadas y no pasaría la revisión de la App Store: a nosotros nos da
      # igual —no publicamos ahí— pero es una razón más para que un paquete así
      # no se confunda nunca con uno de publicación.
      #
      # **A la versión se le pone un sufijo, y no es cosmético.** Una versión que
      # no son tres números hace que la comprobación de actualizaciones se calle
      # («no sé comparar», en internal/actualizacion). Es justo lo que quiere una
      # compilación de diagnóstico: que no se ofrezca a actualizarse a sí misma
      # en mitad del diagnóstico. Además queda a la vista en «Acerca de».
      - name: Compilar la aplicación
        shell: bash
        env:
          INSPECTOR: ${{ inputs.inspector }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev-${GITHUB_SHA::7}"
          etiquetas="${{ matrix.etiquetas }}"
          inspector=""
          if [ "$INSPECTOR" = "true" ]; then
            inspector="-devtools"
            version="$version-inspector"
            echo "::warning::Compilación CON INSPECTOR ($version). Para diagnosticar, no para publicar."
          fi
          wails build -platform ${{ matrix.plataforma }} -clean \
            ${etiquetas:+-tags "$etiquetas"} \
            $inspector \
            -ldflags "-X main.version=$version"

      # El nombre del artefacto lleva la marca, para que no haya forma de bajarse
      # uno de diagnóstico creyendo que es normal. Y dura menos: no tiene por qué
      # sobrevivir al problema que vino a resolver.
      #
      # Al dispararse por etiqueta, «inputs» viene vacío, así que una publicación
      # nunca puede salir con inspector. Publicar va por publicar.yml, que ni
      # siquiera tiene esta entrada.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}${{ inputs.inspector && '-CON-INSPECTOR' || '' }}
          path: build/bin/
          retention-days: ${{ inputs.inspector && 7 || 30 }}

  linea-de-comandos:
    name: Línea de comandos
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # Sin cgo cruza de plataforma desde aquí, así que los seis salen de una vez.
      - name: Compilar los seis objetivos
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev-${GITHUB_SHA::7}"
          make publicar-cli VERSION="$version" GO=go

      - uses: actions/upload-artifact@v4
        with:
          name: esfinge-cli
          path: dist/
          retention-days: 30
