# Publica una versión de Esfinge.
#
# Se dispara al empujar una etiqueta «v*». Compila la aplicación en cada sistema
# —una ventana necesita el webview del suyo y eso no cruza de plataforma—, la
# empaqueta como espera cada uno, y lo cuelga todo de la publicación.
#
# La línea de comandos, que no usa cgo, sale entera desde Linux.

name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de prueba, sin crear publicación"
        required: false
        default: "0.0.0-prueba"

permissions:
  contents: write

jobs:
  # **La puerta.** Nada se compila ni se publica si esto no pasa.
  #
  # Hasta la 2.16.0 no existía: los tests los corría solo «Compilar», en paralelo
  # y sin que nadie dependiera de él, así que una versión salía igual con las
  # pruebas en rojo. Y salió: «Compilar» llevaba **seis versiones fallando** por
  # unos vectores del formato que el .gitignore se había tragado, y lo único que
  # producía era un correo que se leía como ruido. Un aviso que no para nada deja
  # de leerse; una puerta, no.
  #
  # Cuesta un par de minutos antes de compilar tres sistemas. En un programa que
  # guarda las contraseñas de alguien, eso no se discute.
  comprobar:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar la interfaz
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Vet y tests de Go
        run: |
          go vet ./...
          go vet -tags dev ./...
          # Y compilado para los seis objetivos, que es más que «vet de Windows»
          # y lo es por una razón concreta: aquí solo se miraba Windows —que tiene
          # código propio, el registro—, y por macOS se coló que un fichero de cgo
          # **no entra cuando CGO_ENABLED=0**, que es como se cruza la línea de
          # comandos. Un `_darwin.go` de cgo no cubre darwin, y sin su pareja
          # `darwin && !cgo` el trabajo de la línea de comandos se cae aquí abajo,
          # ya con tres sistemas compilados.
          for objetivo in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${objetivo%%/*} GOARCH=${objetivo##*/} go build ./... || exit 1
          done
          go test ./...

      - name: Contraste y tokens
        run: |
          go test ./internal/tema/ -run TestContrasteDeLosDosTemas -v
          go test ./internal/tema/ -run TestLosTokensEstanAlDia

      - name: Tipos de la interfaz
        working-directory: frontend
        run: pnpm exec tsc -b --noEmit

      - name: Pruebas de la interfaz
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      # **Y la extensión, que hasta la 2.18.0 esta puerta no miraba.**
      #
      # Es el mismo agujero que costó seis versiones con los vectores del formato,
      # con otra cara: `make comprobar` sí ejercitaba la extensión —los tipos y,
      # desde la 2.17.6, que el manifiesto declare lo que el código usa—, pero esta
      # puerta repite los pasos a mano en vez de llamar a `make`, y ese trozo no se
      # copió. Una comprobación que la publicación no ejecuta no es una puerta.
      #
      # Y desde la entrega 2 pesa más: aquí es donde se comprueba **qué campo se
      # rellena**, que es lo único de esa entrega que puede hacer daño.
      #
      # El navegador ya lo ha instalado el paso de arriba, pero se pide igual: este
      # espacio de trabajo trae su propio Playwright y puede querer otra versión.
      - name: Comprobaciones de la extensión
        working-directory: navegador
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
          pnpm run comprobar

      # El servidor de cuentas se despliega por su lado (servidor.yml), pero una
      # versión de Esfinge habla con él: si sus pruebas están en rojo, no se publica.
      # La bóveda, la fusión, los códigos y las claves de la cuenta existen en Go y
      # en la extensión desde la fase E, y tienen que dar los mismos bytes (ADR
      # 0040). Aquí y no con los tests de Go: necesitan navegador/ instalado.
      - name: Go y la extensión, cruzados
        env:
          ESFINGE_CRUZADA: "1"
        run: go test -count=1 -run Cruzada ./internal/boveda ./internal/codigos ./internal/cuenta ./internal/navegador

      - name: Comprobaciones del servidor de cuentas
        working-directory: servidor
        run: |
          pnpm install --frozen-lockfile
          pnpm run comprobar

      # **La extensión cargada de verdad** en un Chromium, con cuenta y sin la
      # aplicación, contra el servidor de cuentas levantado aquí (ADR 0040): entrar,
      # rellenar, sincronizar en los dos sentidos, bloquear y el cierre por olvido.
      # Aquí y no con las demás de la extensión: necesita el servidor instalado.
      - name: La extensión cargada, con cuenta
        working-directory: navegador
        run: pnpm exec playwright test -c pruebas-reales

      # Y el cliente de Go y la sincronización contra ese servidor, levantado aquí
      # mismo: sin esto, las pruebas de la tubería se saltan solas.
      - name: La sincronización contra el servidor
        run: herramientas/con-servidor.sh go test -race -count=1 ./internal/cuenta ./internal/sincro ./internal/app

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-pruebas
          path: |
            frontend/playwright-report/
            frontend/test-results/
            navegador/playwright-report/
            navegador/test-results/
          retention-days: 7

  macos:
    name: macOS · imagen de disco
    needs: comprobar
    # **Fijado a propósito, no «macos-latest»** (2026-11-12): a Apolo le retiraron
    # `macos-14` con apagones programados de por medio, y una etiqueta empujada esas horas
    # se habría quedado sin el Mac. Un runner móvil es una dependencia que cambia sola.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Con etiqueta, la versión es la etiqueta sin la «v». A mano, lo que se
      # haya escrito en el formulario.
      - name: Averiguar la versión
        id: v
        shell: bash
        run: |
          n="${{ github.event.inputs.version }}"
          [ -n "$n" ] || n="${GITHUB_REF_NAME#v}"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Instalar wails y create-dmg
        run: |
          bash herramientas/reintentar.sh go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          bash herramientas/reintentar.sh brew install create-dmg

      - name: Construir la interfaz
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Colocar la interfaz
        run: |
          rm -rf internal/interfaz/dist && mkdir -p internal/interfaz/dist
          cp -r frontend/dist/. internal/interfaz/dist/

      - name: Compilar la aplicación
        run: |
          wails build -platform darwin/universal -clean \
            -ldflags "-X main.version=${{ steps.v.outputs.n }}"

      # El puente del navegador va **dentro del paquete**, junto al binario de la
      # aplicación: es lo que el manifiesto de native messaging le dirá a Chrome
      # que lance, y tiene que seguir ahí después de arrastrar la aplicación a
      # Aplicaciones. Universal, como todo lo del paquete.
      - name: Meter el puente del navegador en el paquete
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.n }}" \
              -o "esfinge-puente-$arch" ./cmd/esfinge-puente
          done
          lipo -create -output build/bin/Esfinge.app/Contents/MacOS/esfinge-puente \
            esfinge-puente-amd64 esfinge-puente-arm64
          chmod +x build/bin/Esfinge.app/Contents/MacOS/esfinge-puente
          # Y el servidor MCP, al lado y por lo mismo (ADR 0054): la configuración que
          # Ajustes enseña apunta **ahí**, con ruta absoluta, así que tiene que seguir
          # estando después de arrastrar la aplicación a Aplicaciones.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.n }}" \
              -o "esfinge-mcp-$arch" ./cmd/esfinge-mcp
          done
          lipo -create -output build/bin/Esfinge.app/Contents/MacOS/esfinge-mcp \
            esfinge-mcp-amd64 esfinge-mcp-arm64
          chmod +x build/bin/Esfinge.app/Contents/MacOS/esfinge-mcp
          ls -lh build/bin/Esfinge.app/Contents/MacOS/

      # La receta de la imagen vive en el guion, para que sea la misma aquí y en
      # un Mac con «make dmg».
      - name: Armar la imagen de disco
        run: empaquetado/macos/armar-dmg.sh "${{ steps.v.outputs.n }}"

      # **Y el paquete instalable de Claude Desktop** (ADR 0054). Con el binario
      # universal, el mismo que va dentro de la aplicación: así la extensión no depende
      # de dónde esté instalada Esfinge ni se rompe al actualizarla.
      - name: Armar el paquete de Claude Desktop
        run: |
          lipo -create -output esfinge-mcp-universal esfinge-mcp-amd64 esfinge-mcp-arm64
          nombre="$(go run ./herramientas/catalogo nombre mcpb-darwin "${{ steps.v.outputs.n }}")"
          go run ./herramientas/armar-mcpb "${{ steps.v.outputs.n }}" esfinge-mcp-universal "$PWD/$nombre"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            *.dmg
            *.mcpb

  windows:
    name: Windows · instalador · ${{ matrix.arq }}
    needs: comprobar
    strategy:
      # **Sin fail-fast**: si una arquitectura se cae, la otra tiene que llegar hasta el
      # final para que se vea si el problema es de esa máquina o de las dos. Y la puerta
      # de la publicación para igual, así que no sale nada a medias.
      fail-fast: false
      matrix:
        include:
          - arq: amd64
            os: windows-latest
          # Probada antes en «Compilar», sin publicar nada (fase 1): esa máquina compila
          # `windows/arm64` **y trae NSIS en `/c/Program Files (x86)/NSIS`**, que es justo
          # donde el paso de abajo lo busca. La de x64, medido en tres publicaciones, no lo
          # trae y se lo baja.
          - arq: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Con etiqueta, la versión es la etiqueta sin la «v». A mano, lo que se
      # haya escrito en el formulario.
      - name: Averiguar la versión
        id: v
        shell: bash
        run: |
          n="${{ github.event.inputs.version }}"
          [ -n "$n" ] || n="${GITHUB_REF_NAME#v}"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      # **Lo único del canal con el navegador que se puede ejecutar en Windows sin que
      # nadie lo instale**: los manifiestos, con el registro de verdad de esta
      # máquina. Que un navegador lance el puente no lo dice ninguna máquina de
      # GitHub.
      - name: Pruebas del canal con el navegador en Windows
        shell: bash
        run: go test ./internal/app/ -run 'Manifiest|Chromium|Perfil|Windows|Registro' -v

      # Chocolatey instala NSIS pero no lo deja en el PATH, y wails no lo busca
      # en ningún otro sitio: sin esto avisa de que no encuentra «makensis» y
      # sale con código cero, dejando el trabajo en verde y sin instalador.
      # **NSIS, el de la máquina si lo trae.**
      #
      # Antes se bajaba de Chocolatey, y ese tercero devolvió 503 durante media hora y dejó
      # sin publicar la 2.17.6 — el mismo error que ya costó la 2.14.0 con un repositorio de
      # apt. Así que primero se mira si la máquina lo trae y, si no, se baja **del origen y
      # con su suma**.
      #
      # **Y aquí había una frase que medimos falsa el 2026-11-12.** Decía que «la imagen de
      # Windows de GitHub ya lo incluye», y el registro de las tres últimas publicaciones
      # dice lo contrario: en `windows-latest` sale «NSIS no viene con la máquina» las tres
      # veces, así que se baja en cada publicación. Donde **sí** viene es en
      # `windows-11-arm`, que lo trae en `/c/Program Files (x86)/NSIS` — justo donde
      # `buscar()` mira. O sea al revés de lo que estaba escrito. El código hacía lo
      # correcto; lo que caducó fue el porqué de al lado.
      - name: Instalar wails y NSIS
        shell: bash
        run: |
          bash herramientas/reintentar.sh go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

          buscar() {
            for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
              [ -x "$d/makensis.exe" ] && { echo "$d"; return 0; }
            done
            return 1
          }

          if nsis=$(buscar); then
            echo "NSIS ya viene con la máquina: $nsis"
          else
            # **Del origen y con su suma, no de un intermediario.**
            #
            # Antes se bajaba de Chocolatey, y su servidor devolvió 503 durante
            # media hora: dos publicaciones caídas en una tarde con todo lo demás
            # en verde. Aquí se coge el zip que publica el propio proyecto NSIS,
            # se comprueba la suma —una descarga sin comprobar es peor que una
            # dependencia— y se descomprime. Sin instalador y sin gestor de
            # paquetes por medio.
            echo "NSIS no viene con la máquina; se baja del proyecto NSIS"
            version=3.10
            suma=fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110
            curl -sSL --retry 3 --retry-delay 5 -o nsis.zip \
              "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
            echo "$suma  nsis.zip" | sha256sum -c - || {
              echo "::error::El zip de NSIS no es el que se esperaba"
              exit 1
            }
            unzip -q nsis.zip -d /c/nsis
            nsis="/c/nsis/nsis-$version"
            # NSISDIR le dice al compilador dónde están sus cabeceras y sus
            # plantillas. Con el zip no hay instalador que lo apunte en el
            # registro, así que se dice a mano.
            echo "NSISDIR=$(cygpath -w "$nsis")" >> "$GITHUB_ENV"
            [ -x "$nsis/makensis.exe" ] || {
              echo "::error::El zip de NSIS no trae makensis donde se esperaba"
              exit 1
            }
          fi
          # GITHUB_PATH quiere la ruta como la entiende Windows. Con la de Git
          # bash —«/c/Program Files (x86)/NSIS»— el fichero está y el paso pasa,
          # pero wails sigue sin encontrar makensis, que es lo que ocurrió en la
          # 2.0.2.
          cygpath -w "$nsis" >> "$GITHUB_PATH"

      # En PowerShell y no en bash: Git bash convierte los argumentos que empiezan
      # por «/» en rutas, y «/VERSION» le llega a makensis como
      # «C:/Program Files/Git/VERSION», que intenta abrir como guion.
      - name: Comprobar que makensis está donde wails lo busca
        shell: pwsh
        run: makensis /VERSION

      - name: Construir la interfaz
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Colocar la interfaz
        shell: bash
        run: |
          rm -rf internal/interfaz/dist && mkdir -p internal/interfaz/dist
          cp -r frontend/dist/. internal/interfaz/dist/

      # -nsis produce el asistente de instalación de siempre, que además registra
      # los ficheros .esf declarados en wails.json. Si no puede, avisa y sigue
      # como si nada, así que aquí se comprueba que el instalador existe de
      # verdad en vez de fiarse del código de salida.
      # **El puente del navegador, para meterlo en el instalador** (ver
      # build/windows/installer/project.nsi). Para el subsistema gráfico, como pide
      # cmd/esfinge-puente: sin consola que parpadee cada vez que el navegador lo
      # lanza. Aquí y no en build/bin, que wails vacía con -clean.
      - name: Compilar el puente del navegador
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.arq }} go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.v.outputs.n }}" \
            -o build/windows/installer/esfinge-puente.exe ./cmd/esfinge-puente
          # Y el servidor MCP, con el mismo subsistema gráfico y por lo mismo: lo lanza
          # otro programa y la salida estándar *es* el protocolo (ADR 0054).
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.arq }} go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.v.outputs.n }}" \
            -o build/windows/installer/esfinge-mcp.exe ./cmd/esfinge-mcp
          ls -lh build/windows/installer/esfinge-puente.exe build/windows/installer/esfinge-mcp.exe

      - name: Compilar la aplicación y su instalador
        shell: bash
        run: |
          wails build -platform windows/${{ matrix.arq }} -clean -nsis \
            -ldflags "-X main.version=${{ steps.v.outputs.n }}"
          ls -lh build/bin/
          if ! ls build/bin/*installer*.exe >/dev/null 2>&1; then
            echo "::error::wails no ha producido el instalador NSIS"
            exit 1
          fi
          # **El nombre lo dice el catálogo**, no se compone aquí: es el único sitio donde
          # viven los nombres de los adjuntos, y de él salen también las dos tablas de
          # descargas y la puerta de la publicación (ADR 0060).
          #
          # El glob de `mv` sigue valiendo con dos arquitecturas, al contrario de lo que
          # parecía: cada pata de la matriz es un trabajo con su propio espacio de trabajo,
          # así que ahí dentro hay **un** instalador y no dos.
          nombre="$(go run ./herramientas/catalogo nombre "app-windows-${{ matrix.arq }}" "${{ steps.v.outputs.n }}")"
          mv build/bin/*installer*.exe "$nombre"
          ls -lh "$nombre"
          # Y que de verdad lleve el puente: un instalador sin él se compila igual
          # y deja la extensión muerta en Windows sin decir nada.
          if ! 7z l "$nombre" | grep -qi "esfinge-puente.exe"; then
            echo "::error::El instalador no lleva esfinge-puente.exe"
            exit 1
          fi
          # Lo mismo con el servidor MCP: sin él, la configuración que Ajustes enseña
          # apunta a un fichero que no está, y eso no se ve hasta que alguien la pega.
          if ! 7z l "$nombre" | grep -qi "esfinge-mcp.exe"; then
            echo "::error::El instalador no lleva esfinge-mcp.exe"
            exit 1
          fi

      # Y el paquete de Claude Desktop, con el binario de Windows que ya está compilado.
      - name: Armar el paquete de Claude Desktop
        shell: bash
        run: |
          nombre="$(go run ./herramientas/catalogo nombre "mcpb-windows-${{ matrix.arq }}" "${{ steps.v.outputs.n }}")"
          go run ./herramientas/armar-mcpb "${{ steps.v.outputs.n }}" \
            build/windows/installer/esfinge-mcp.exe "$PWD/$nombre"

      # El nombre lleva la arquitectura: dos patas subiendo un artefacto llamado igual
      # se pisan, y el que llegue segundo falla o sobrescribe.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arq }}
          path: |
            *instalador.exe
            *.mcpb

  linux:
    name: Linux · paquete · ${{ matrix.arq }}
    needs: comprobar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arq: amd64
            os: ubuntu-latest
          # **La misma distribución que la otra pata, a propósito** (24.04): así las dos
          # llevan el mismo WebKit y el mismo suelo de glibc, y una diferencia entre ellas
          # no puede ser de la distribución. Probada en «Compilar» antes de que ninguna
          # etiqueta dependiera de ella. Bajar las dos a 22.04 ganaría Debian 12 y es otra
          # decisión.
          - arq: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Con etiqueta, la versión es la etiqueta sin la «v». A mano, lo que se
      # haya escrito en el formulario.
      - name: Averiguar la versión
        id: v
        shell: bash
        run: |
          n="${{ github.event.inputs.version }}"
          [ -n "$n" ] || n="${GITHUB_REF_NAME#v}"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Dependencias del sistema
        run: |
          # **Fuera los repositorios de terceros antes de mirar.**
          #
          # La máquina de GitHub trae listas que esta compilación no necesita para
          # nada —la de Chrome, entre otras— y `apt-get update` **falla entero** si
          # cualquiera de ellas sirve un índice caducado. Eso dejó sin publicar la
          # 2.14.0: un problema en un servidor de Google, en una compilación que
          # solo necesita GTK y WebKit de los archivos de Ubuntu.
          # Se buscan **por contenido y no por nombre**: el nombre del fichero
          # cambia entre imágenes de la máquina —`.list`, `.sources`, o dentro del
          # `sources.list` de siempre— y quitar el que uno supone deja el problema
          # igual, que es lo que pasó al primer intento.
          grep -rIl 'dl\.google\.com\|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d;/packages\.microsoft\.com/d' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # **nfpm con versión fija, no «@latest»** (2026-11-12). Una dependencia de la
      # compilación no puede colgar de un blanco móvil: ya ha costado tres publicaciones
      # en este proyecto. Y no la última: la v2.49.0 salió el mismo día que esto se
      # escribió, y aquí se fijan versiones con al menos una semana — la misma regla que
      # el freno de pnpm, por lo mismo.
      - name: Instalar wails y nfpm
        run: |
          bash herramientas/reintentar.sh go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          bash herramientas/reintentar.sh go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Construir la interfaz
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Colocar la interfaz
        run: |
          rm -rf internal/interfaz/dist && mkdir -p internal/interfaz/dist
          cp -r frontend/dist/. internal/interfaz/dist/

      # Ubuntu reciente ya no trae webkit2gtk-4.0, que es lo que Wails busca de
      # serie. La 4.1 se pide con su etiqueta.
      - name: Compilar la aplicación
        run: |
          wails build -platform linux/${{ matrix.arq }} -clean -tags webkit2_41 \
            -ldflags "-X main.version=${{ steps.v.outputs.n }}"

      # El paquete lleva las dos caras: la ventana y la línea de comandos.
      - name: Compilar la línea de comandos
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.n }}" \
            -o esfinge ./cmd/esfinge
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.n }}" \
            -o esfinge-puente ./cmd/esfinge-puente
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.n }}" \
            -o esfinge-mcp ./cmd/esfinge-mcp

      - name: Armar el .deb y el .tar.gz
        run: |
          export VERSION="${{ steps.v.outputs.n }}"
          # **La arquitectura se la dice nfpm por el entorno y el nombre lo dice el
          # catálogo**: ni una cosa ni la otra se componen aquí (ADR 0060).
          export ARQUITECTURA="${{ matrix.arq }}"
          deb="$(go run ./herramientas/catalogo nombre "deb-${{ matrix.arq }}" "$VERSION")"
          nfpm package -f empaquetado/linux/nfpm.yaml -p deb -t "$deb"
          # **Y el .rpm, del mismo fichero** (fase 3): nfpm lo escribe él, sin rpmbuild, y
          # traduce la arquitectura —amd64 a x86_64, arm64 a aarch64—. Lo que cambia son
          # los nombres de las bibliotecas, que van en `overrides`.
          rpm="$(go run ./herramientas/catalogo nombre "rpm-${{ matrix.arq }}" "$VERSION")"
          nfpm package -f empaquetado/linux/nfpm.yaml -p rpm -t "$rpm"
          tgz="$(go run ./herramientas/catalogo nombre "tar-${{ matrix.arq }}" "$VERSION")"
          tar -czf "$tgz" \
            -C build/bin Esfinge \
            -C "$GITHUB_WORKSPACE" esfinge esfinge-puente esfinge-mcp LICENSE
          ls -lh *.deb *.rpm *.tar.gz
          # Y que el paquete declare la arquitectura que es: un .deb de amd64 en una
          # máquina ARM lo rechaza dpkg, y eso es lo que había que arreglar.
          dpkg-deb -f "$deb" Architecture | grep -qx "${{ matrix.arq }}" || {
            echo "::error::El .deb no declara la arquitectura ${{ matrix.arq }}"
            exit 1
          }
          # Y lo mismo con el rpm, que nombra las arquitecturas de otra forma.
          #
          # `rpm` está en las dos imágenes de Linux —4.18.2, lo dice su propia lista de
          # software—, y la fase 1 vio `rpmbuild` en las dos. **No es lo mismo que haberlo
          # ejecutado ahí**: si algún día falta, este paso dirá «command not found» y
          # tirará la publicación. La alternativa era mirarlo solo dentro del contenedor de
          # Fedora, donde el `rpm` lo pone la imagen, y se ha preferido fallar aquí, que es
          # donde se fabrica el paquete.
          esperada="${{ matrix.arq }}"
          [ "$esperada" = amd64 ] && esperada=x86_64
          [ "$esperada" = arm64 ] && esperada=aarch64
          rpm -qp --queryformat '%{ARCH}\n' "$rpm" | grep -qx "$esperada" || {
            echo "::error::El .rpm no declara la arquitectura $esperada"
            exit 1
          }
          rpm -qp --requires "$rpm" | sort | sed 's/^/  pide: /'

      - name: Armar el paquete de Claude Desktop
        run: |
          nombre="$(go run ./herramientas/catalogo nombre "mcpb-linux-${{ matrix.arq }}" "${{ steps.v.outputs.n }}")"
          go run ./herramientas/armar-mcpb "${{ steps.v.outputs.n }}" esfinge-mcp "$PWD/$nombre"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arq }}
          path: |
            *.deb
            *.rpm
            *.mcpb
            *.tar.gz

  # **Que los paquetes instalen de verdad, en la distribución a la que van.**
  #
  # Hasta aquí lo que había era que nfpm los escribiera y que declararan la arquitectura
  # que toca. Eso no dice que `dnf` los acepte: los nombres de las bibliotecas **cambian
  # por distribución** —en Fedora son `webkit2gtk4.1` y `gtk3`, sin el guion de Debian— y
  # un `depends` equivocado se empaqueta igual de bien y falla en el equipo de quien
  # instala. Es el mismo trato que `esfinge boveda listar` en el VPS: no basta con que el
  # fichero exista, tiene que hacer su trabajo.
  #
  # Va **antes** de publicar, con `publicar` esperándolo: un paquete que no instala no
  # debería llegar a la página de descargas.
  #
  # Y comprueba una cosa más que no se puede ver desde Go: que el `postinstall` **corre de
  # verdad** y deja escrito el gestor. De ese fichero depende que a una Fedora no se le
  # ofrezca un `.deb` al actualizarse (ADR 0060).
  humo:
    name: Humo · paquetes · ${{ matrix.arq }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arq: amd64
            os: ubuntu-latest
          - arq: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "linux-${{ matrix.arq }}", path: paquetes }

      - name: Fedora instala el .rpm
        run: |
          set -euo pipefail
          rpm="$(ls paquetes/*.rpm)"
          echo "::group::$rpm"
          docker run --rm -v "$PWD/paquetes:/p:ro" fedora:41 bash -euo pipefail -c '
            rpm -qpi /p/*.rpm
            echo "— lo que pide —"; rpm -qp --requires /p/*.rpm
            dnf install -y /p/*.rpm
            # Ninguna biblioteca sin resolver: es lo que de verdad dice que el «depends»
            # era el bueno. `ldd` marca lo que falta con «not found».
            ldd /usr/bin/esfinge-gui | grep -i "not found" && { echo "::error::Faltan bibliotecas"; exit 1; } || true
            esfinge --version
            # Y el gestor que dejó el postinstall, que es de lo que depende que a esta
            # máquina no se le ofrezca un .deb.
            test "$(cat /usr/share/esfinge/gestor)" = rpm || {
              echo "::error::El postinstall del rpm no ha dejado «rpm» en /usr/share/esfinge/gestor"
              exit 1
            }
            echo "✓ el .rpm instala, resuelve sus bibliotecas y se declara como rpm"
          '
          echo "::endgroup::"

      - name: Debian instala el .deb
        run: |
          set -euo pipefail
          echo "::group::$(ls paquetes/*.deb)"
          docker run --rm -v "$PWD/paquetes:/p:ro" debian:13 bash -euo pipefail -c '
            dpkg -I /p/*.deb | sed -n "1,12p"
            apt-get update -qq
            apt-get install -y /p/*.deb
            ldd /usr/bin/esfinge-gui | grep -i "not found" && { echo "::error::Faltan bibliotecas"; exit 1; } || true
            esfinge --version
            test "$(cat /usr/share/esfinge/gestor)" = deb || {
              echo "::error::El postinstall del deb no ha dejado «deb» en /usr/share/esfinge/gestor"
              exit 1
            }
            echo "✓ el .deb instala, resuelve sus bibliotecas y se declara como deb"
          '
          echo "::endgroup::"

  linea-de-comandos:
    name: Línea de comandos
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }

      - name: Compilar los seis objetivos
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          make publicar-cli VERSION="$version" GO=go
          ls -lh dist/

      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # La extensión se empaqueta aquí para el trabajo `tiendas`, que la sube a
      # Chrome y a Firefox. **Desde que está en las dos (2026-09-18) sus zip para
      # cargarla a mano ya no se cuelgan de la publicación**: los quita el trabajo
      # `publicar`. Se quedan el de la tienda de Chrome y el de código fuente.
      - name: Empaquetar la extensión del navegador
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          # **Con la versión dicha**: sin ella, `make` la saca de `git describe`, y en
          # un lanzamiento a mano sin etiqueta sale un hash cuyo primer número acaba
          # en el manifiesto. Las tiendas exigen que cada versión sea mayor.
          make extension VERSION="$version"
          for n in chrome firefox; do
            (cd "navegador/dist/$n" && zip -qr "$GITHUB_WORKSPACE/dist/esfinge-extension-$version-$n.zip" .)
          done
          # **Y lo que necesitan las tiendas** (ADR 0033): el paquete de Chrome **sin la
          # clave de desarrollo** —el identificador lo asigna la tienda— y el código
          # fuente que exige Mozilla para revisar lo empaquetado con Vite.
          rm -rf "$RUNNER_TEMP/tienda" && cp -r navegador/dist/chrome "$RUNNER_TEMP/tienda"
          node -e 'const fs=require("fs"),f=process.argv[1],m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2)+"\n")' "$RUNNER_TEMP/tienda/manifest.json"
          (cd "$RUNNER_TEMP/tienda" && zip -qr "$GITHUB_WORKSPACE/dist/esfinge-extension-$version-chrome-tienda.zip" .)
          herramientas/fuente-de-la-extension.sh "$version" "$GITHUB_WORKSPACE/dist/esfinge-extension-$version-fuente.zip"
          # Y las sumas otra vez, que se hicieron antes de existir estos ficheros.
          # Un SHA256SUMS que no cubre todo lo publicado es peor que no tenerlo.
          (cd dist && sha256sum esfinge-* > SHA256SUMS)
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  publicar:
    name: Publicar
    needs: [macos, windows, linux, linea-de-comandos, humo]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **Go aquí también**, que este trabajo no compilaba nada y ahora le pregunta al
      # catálogo: la puerta de abajo y el cuerpo de la publicación salen de él.
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: go.sum }
      - uses: actions/download-artifact@v4
        with: { path: adjuntos, merge-multiple: true }

      # El SHA256SUMS que trae el trabajo de la línea de comandos solo cubre sus
      # seis binarios. Aquí se rehace sobre todo lo que se publica —el DMG, el
      # instalador, el .deb— porque es contra estas líneas contra lo que compara
      # la aplicación cuando se descarga su propia actualización.
      - name: Resumir todo lo que se publica
        working-directory: adjuntos
        run: |
          # Los zip para cargar la extensión a mano ya no se publican: desde el
          # 2026-09-18 se instala desde las tiendas y se actualiza sola.
          rm -f esfinge-extension-*-chrome.zip esfinge-extension-*-firefox.zip
          rm -f SHA256SUMS
          # El propio fichero queda fuera de la lista. La redirección lo crea
          # antes de que corra «find», así que se colaría con el resumen de sí
          # mismo a medio escribir: un «sha256sum -c» daría FAILED justo en el
          # fichero que sirve para confiar.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # **La puerta: lo que hay contra lo que el catálogo dice que tiene que haber, en
      # los dos sentidos.** Que no falte ninguno y que no sobre ninguno.
      #
      # El segundo sentido es el que nadie pone y el que de verdad hace falta: un adjunto
      # que se cuela con el nombre mal escrito no lo ve nadie —la publicación sale
      # entera— hasta que alguien pulsa un enlace de la tabla y recibe un 404. Y un
      # adjunto que falta porque una pata de la matriz se cayó deja la publicación a
      # medias con todo lo demás en verde, que es como se ha caído esto antes.
      #
      # El catálogo vive en Go (internal/adjuntos) porque es lo único que seguro está en
      # las cinco máquinas que compilan: la lección de «zip».
      - name: La publicación lleva exactamente lo que dice el catálogo
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./herramientas/catalogo lista "$version" | sort > /tmp/esperados.txt
          (cd adjuntos && ls -1) | sort > /tmp/hay.txt
          if ! diff -u /tmp/esperados.txt /tmp/hay.txt; then
            echo "::error::Lo publicado no es lo que dice el catálogo. Las líneas con «-» faltan y las con «+» sobran."
            exit 1
          fi
          echo "✓ $(wc -l < /tmp/hay.txt) adjuntos, los del catálogo y ninguno más"

      - name: Qué se va a publicar
        run: ls -lhR adjuntos

      # **El cuerpo sale del catálogo**, no de una tabla escrita aquí. Era la segunda
      # copia de la misma lista —la otra es la del README— con `amd64` cableado en las
      # dos, y dos copias de una lista se desalinean solas.
      - name: Escribir el cuerpo de la publicación
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./herramientas/catalogo cuerpo-release "$version" > /tmp/cuerpo.md
          cat >> /tmp/cuerpo.md <<'FIN'

          **La primera vez el sistema avisará de que Esfinge no está firmada.** Es cierto:
          firmar cuesta 99 $ al año y se decidió no hacerlo. En macOS, si el aviso no te
          deja abrirla, ve a Ajustes del Sistema → Privacidad y seguridad y pulsa «Abrir de
          todos modos».

          **Sin la clave no hay forma de recuperar nada.** Guárdala antes de cifrar.
          FIN
          cat /tmp/cuerpo.md

      - uses: softprops/action-gh-release@v2
        with:
          files: adjuntos/*
          generate_release_notes: true
          body_path: /tmp/cuerpo.md

      # La tabla del README enlaza los ficheros de esta versión, que llevan el
      # número en el nombre. Se reescribe aquí para que no se quede vieja: a mano
      # se olvida en la segunda publicación. Va sobre «main», no sobre la
      # etiqueta, que es lo que se ve al entrar al repositorio.
      - name: Poner al día la tabla de descargas del README
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 --branch main \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            portada
          cd portada
          herramientas/actualizar-descargas.sh "$version"
          if git diff --quiet; then
            echo "La portada ya estaba al día"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tabla de descargas de la $version"
          git push

  # **La extensión en las tiendas** (ADR 0033), después de la publicación de GitHub y sin
  # frenarla: si una tienda falla, las descargas ya están, y este trabajo sale en rojo
  # diciendo por qué. **Sin los secretos, avisa y se salta**: hasta que el cliente dé de
  # alta las cuentas (docs/tiendas/pasos.md) no hay nada que subir.
  tiendas:
    name: Tiendas
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cli, path: adjuntos }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Averiguar la versión
        id: v
        run: echo "n=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # **Lo que hará Mozilla, antes de mandárselo**: compilar el código fuente en una
      # carpeta limpia y comparar byte a byte con el paquete. Si difiere, rechazarían la
      # versión; mejor saberlo aquí.
      - name: Comprobar que el código fuente da el mismo paquete
        run: |
          n="${{ steps.v.outputs.n }}"
          mkdir -p fuente paquete
          unzip -q "adjuntos/esfinge-extension-$n-fuente.zip" -d fuente
          unzip -q "adjuntos/esfinge-extension-$n-firefox.zip" -d paquete
          (cd fuente/navegador && pnpm install --frozen-lockfile && NAVEGADOR=firefox VERSION="$n" pnpm run build)
          diff -r fuente/navegador/dist/firefox paquete
          echo "El código fuente da el mismo paquete, byte a byte"

      - name: Firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::Sin las claves de addons.mozilla.org: no se sube a Firefox (docs/tiendas/pasos.md)"
            exit 0
          fi
          n="${{ steps.v.outputs.n }}"
          # Sin esperar a la revisión: una cola de revisión no es un fallo de la publicación.
          #
          # Y **subir una versión que ya está subida es un aviso, no un fallo**, como
          # con Chrome desde la 2.23.2: pasa si se mueve una etiqueta y se vuelve a
          # publicar. Lo que no puede pasar es que el correo de «ha fallado» deje de
          # significar algo.
          salida="$RUNNER_TEMP/firefox.log"
          # **Con `pipefail`**, que si no el código de salida sería el de `tee` —cero
          # siempre— y un fallo de verdad pasaría por bueno (CLAUDE.md).
          set -o pipefail
          if npx --yes web-ext@10.6.0 sign \
            --channel=listed \
            --approval-timeout=0 \
            --source-dir paquete \
            --upload-source-code "adjuntos/esfinge-extension-$n-fuente.zip" \
            --amo-metadata docs/tiendas/amo-metadata.json 2>&1 | tee "$salida"; then
            exit 0
          fi
          if grep -q "already exists" "$salida"; then
            echo "::warning::Firefox ya tenía la versión $n: no se vuelve a subir"
            exit 0
          fi
          exit 1

      - name: Chrome
        env:
          CWS_CUENTA_DE_SERVICIO: ${{ secrets.CWS_CUENTA_DE_SERVICIO }}
          CWS_EDITOR: ${{ secrets.CWS_EDITOR }}
          CWS_EXTENSION: ${{ secrets.CWS_EXTENSION }}
        run: |
          if [ -z "$CWS_CUENTA_DE_SERVICIO" ] || [ -z "$CWS_EDITOR" ] || [ -z "$CWS_EXTENSION" ]; then
            echo "::notice::Sin la cuenta de servicio de la Chrome Web Store: no se sube a Chrome (docs/tiendas/pasos.md)"
            exit 0
          fi
          node herramientas/tienda-chrome.mjs "adjuntos/esfinge-extension-${{ steps.v.outputs.n }}-chrome-tienda.zip"
